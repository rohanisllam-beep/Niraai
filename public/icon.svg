      <stop offset="100%" stop-color="#8492ac" stop-opacity="0.7"/>
    </linearGradient>
  </defs>
  
  <rect width="512" height="512" rx="128" fill="url(#bg)"/>
  <circle cx="256" cy="256" r="210" fill="url(#glow)"/>
  <circle cx="256" cy="256" r="160" stroke="url(#ring)" stroke-width="4" fill="none"/>
  <circle cx="256" cy="256" r="120" stroke="url(#ring)" stroke-width="2" stroke-dasharray="8 6" fill="none"/>
  <circle cx="256" cy="256" r="76" fill="url(#silverOrb)"/>
  <circle cx="240" cy="240" r="18" fill="#ffffff" opacity="0.9"/>
